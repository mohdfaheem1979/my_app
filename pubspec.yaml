name: my_app
description: "Cross-platform company messenger"
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0
  cloud_functions: ^6.4.0
  firebase_storage: ^13.5.0
  file_picker: ^12.2.0
